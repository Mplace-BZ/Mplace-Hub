<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prezentacja — MPlace Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#fff;color:#111;font-family:'DM Sans',sans-serif;font-size:14px;padding:2.5rem 2rem 4rem;max-width:900px;margin:0 auto;}
    .slide-block{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:2rem 2.5rem;margin-bottom:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.06);}
    .slide-number{font-family:'DM Mono',monospace;font-size:8px;color:#b47fff;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.75rem;}
    .slide-title{line-height:1.7;color:#374151;font-size:13px;}
    .slide-puenta{margin-top:1rem;padding:.6rem 1rem;background:#faf5ff;border-left:3px solid #b47fff;font-weight:500;color:#111;font-size:12px;border-radius:0 6px 6px 0;}
    .slide-title h1,.slide-title h2,.slide-title h3{font-family:'DM Mono',monospace;font-weight:600;color:#111;margin:0 0 .5rem;line-height:1.3;}
    .slide-title h1{font-size:22px;}.slide-title h2{font-size:18px;}.slide-title h3{font-size:15px;}
    .slide-title p{margin:.5rem 0;}
    .slide-title ul,.slide-title ol{padding-left:1.25rem;margin:.5rem 0;}
    .slide-title li{margin:.25rem 0;}
    .slide-title strong{color:#111;}
    .slide-title blockquote{font-style:italic;color:#6b7280;font-size:12px;margin-bottom:1rem;border-left:3px solid #b47fff;padding-left:.75rem;}
    .slide-title table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;}
    .slide-title table th,.slide-title table td{border:1px solid #e5e7eb;padding:8px 10px;text-align:left;vertical-align:top;word-break:break-word;}
    .slide-title table th{background:#f9fafb;font-weight:600;font-family:'DM Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.04em;}
    .slide-title table tr:nth-child(even) td{background:#fafafa;}
    #status{text-align:center;padding:5rem 2rem;font-family:'DM Mono',monospace;font-size:13px;color:#6b7280;}
    #status.err{color:#ff4d6a;}
  </style>
</head>
<body>
  <div id="status">Ładowanie prezentacji...</div>
  <div id="content"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyDY9auc3QvLCsCxELZZnVLiNTzseHt7cpQ",
      authDomain:        "mplace-hub.firebaseapp.com",
      projectId:         "mplace-hub",
      storageBucket:     "mplace-hub.firebasestorage.app",
      messagingSenderId: "301464643830",
      appId:             "1:301464643830:web:e256a5434ec148f1b9e4d7"
    });

    const id = new URLSearchParams(window.location.search).get('id');
    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');

    if (!id) {
      statusEl.className = 'err';
      statusEl.textContent = 'Brak ID prezentacji.';
    } else {
      firebase.firestore().collection('publicPresentations').doc(id).get()
        .then(doc => {
          statusEl.style.display = 'none';
          if (!doc.exists) {
            statusEl.style.display = '';
            statusEl.className = 'err';
            statusEl.textContent = 'Prezentacja nie istnieje lub została usunięta.';
            return;
          }
          contentEl.innerHTML = DOMPurify.sanitize(doc.data().html, { USE_PROFILES: { html: true }, ADD_TAGS: ['style'], ADD_ATTR: ['class', 'style'] });
        })
        .catch(err => {
          statusEl.className = 'err';
          statusEl.textContent = 'Błąd ładowania: ' + err.message;
        });
    }
  </script>
</body>
</html>
